# Copy this file to config.toml, or run `python3 setup_config.py`.
# Relative model paths are resolved from this file's directory.

[llm]
base_url = "http://127.0.0.1:8080/v1"
model = "local"
temperature = 0.1
request_timeout = 180

[ssh]
host = "proxmox.example.com"
user = "proxmox-user"
timeout = 60
connect_timeout = 10
batch_mode = true
strict_host_key_checking = "yes"

[agent]
max_steps = 8
max_tokens = 200
auto_confirm_safe = false

[chat]
max_tokens = 300
context_tokens = 8192
context_reserve = 600
context_detection_timeout = 2
max_tool_chars = 6000
memory_min_tokens = 300
memory_max_tokens = 700

[server]
model_path = "models/model.gguf"
model_alias = "local-model-ctx{n_ctx}"
host = "127.0.0.1"
port = 8080
n_gpu_layers = 0
n_ctx = 8192
n_batch = 128
n_ubatch = 32
n_threads = 4
n_threads_batch = 4
kv_type = "q8_0"
chat_format = "chatml"
model_vram_mib = 1300
embedding_size_estimate = 4100
